<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&amp;family=Manrope:wght@400;500;600&amp;family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: {
                            DEFAULT: '#FED609',
                            dark: '#FFD70B',
                        },
                        cream: '#FEFAEF',
                        ivory: '#FFFAE2',
                        dark: '#1A1A1A',
                        muted: '#6B7280'
                    },
                    fontFamily: {
                        "headline": ["Sora"],
                        "body": ["Manrope"],
                        "label": ["DM Sans"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "0.75rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .form-input-focus:focus {
            border-color: #FED609;
            --tw-ring-color: #FED609;
        }
    </style>
</head>
<body class="bg-white font-body text-dark antialiased">
<main class="min-h-screen flex flex-col md:flex-row">
<!-- Left Side: Brand Identity -->
<section class="hidden md:flex md:w-1/2 bg-primary relative flex-col justify-between p-12 overflow-hidden">
<!-- Decorative Elements -->
<div class="absolute top-0 right-0 w-64 h-64 bg-white/10 rounded-full -mr-32 -mt-32 blur-3xl"></div>
<div class="absolute bottom-0 left-0 w-96 h-96 bg-black/5 rounded-full -ml-48 -mb-48 blur-3xl"></div>
<!-- Logo & Tagline -->
<div class="relative z-10">
<div class="text-3xl font-black text-white font-headline tracking-tighter mb-2">
                    Prophives
                </div>
<p class="text-white/90 font-medium font-label tracking-wide uppercase text-sm">
                    AI-Powered Property Management
                </p>
</div>
<!-- Illustration Area -->
<div class="relative z-10 flex-grow flex items-center justify-center">
<div class="w-full max-w-md aspect-square relative">
<div class="absolute inset-0 bg-white/20 rounded-xl rotate-3"></div>
<div class="absolute inset-0 bg-white/10 rounded-xl -rotate-3"></div>

</div>
</div>
<!-- Testimonial -->
<div class="relative z-10 bg-white/10 backdrop-blur-md p-8 rounded-xl border border-white/20">
<p class="text-white text-lg font-headline font-semibold italic mb-4">
                    "Prophives changed how I manage my Dubai portfolio."
                </p>
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-white/20 border border-white/40 flex items-center justify-center overflow-hidden">
<img alt="Omar K." class="w-full h-full object-cover" data-alt="Close up portrait of a professional middle-eastern businessman smiling in a sharp suit against a neutral background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD2L_L8S2BpUVBstxOk1N46L7Jv2MQnUZ7qC3qrlLlcgFsxnOzDfVUG35zmm_dIHriXbQ6F5kNVLWSfD1OrsJIS_pJ4hTI4nULbllKvk4BjZ55mx1LhSHXOB_eubFRGC0NlUxNvV6cOqdEsopxcFBoDgWqRF2foYmQDOIFZlwuXewyqqqOCf6fqa-U7Qe4HNmj0Tvh_N4kbWRLmX7KR2hLVieKVmFzDhNnunVBWy2GvN35fK6jO-vmjve2yvngbJnja06hOYk_RDPVC"/>
</div>
<div>
<p class="text-white font-bold font-label text-sm leading-none">Omar K.</p>
<p class="text-white/70 text-xs font-medium">Portfolio Owner, Dubai Marina</p>
</div>
</div>
</div>
</section>
<!-- Right Side: Interaction Area -->
<section class="w-full md:w-1/2 flex items-center justify-center p-6 md:p-12 lg:p-24 bg-white">
<div class="w-full max-w-md">
<!-- Branding for Mobile -->
<div class="md:hidden mb-8">
<span class="text-2xl font-black text-primary font-headline">Prophives</span>
</div>
<!-- Tabs -->
<div class="flex gap-8 mb-10 border-b border-stone-100">
<button class="pb-4 text-dark font-bold font-headline relative group">
                        Login
                        <span class="absolute bottom-0 left-0 w-full h-1 bg-primary rounded-t-full"></span>
</button>
<button class="pb-4 text-muted font-medium font-headline hover:text-dark transition-colors relative group">
                        Register
                        <span class="absolute bottom-0 left-0 w-0 group-hover:w-full h-1 bg-primary/30 transition-all rounded-t-full"></span>
</button>
</div>
<!-- Header Content -->
<div class="mb-8">
<h1 class="text-3xl font-bold font-headline mb-2">Welcome Back</h1>
<p class="text-muted font-body">Access your property dashboard and AI insights.</p>
</div>
<!-- Login Form -->
<form class="space-y-6">
<div>
<label class="block text-sm font-bold font-label text-dark mb-2">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-muted text-xl">mail</span>
<input class="w-full pl-12 pr-4 py-3 bg-cream border-transparent rounded-lg font-body text-dark focus:ring-2 focus:ring-primary focus:bg-white transition-all" placeholder="owner@example.com" type="email"/>
</div>
</div>
<div>
<div class="flex justify-between mb-2">
<label class="block text-sm font-bold font-label text-dark">Password</label>
<a class="text-sm font-bold font-label text-primary-dark hover:underline" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-muted text-xl">lock</span>
<input class="w-full pl-12 pr-12 py-3 bg-cream border-transparent rounded-lg font-body text-dark focus:ring-2 focus:ring-primary focus:bg-white transition-all" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-muted hover:text-dark" type="button">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
</div>
<div class="flex items-center">
<input class="w-5 h-5 rounded border-stone-200 text-primary focus:ring-primary cursor-pointer" id="remember" type="checkbox"/>
<label class="ml-3 text-sm font-medium font-body text-muted cursor-pointer select-none" for="remember">Remember me for 30 days</label>
</div>
<button class="w-full bg-primary hover:bg-primary-dark text-dark font-bold font-headline py-4 rounded-lg shadow-lg shadow-primary/20 active:scale-[0.98] transition-all" type="submit">
                        Sign In
                    </button>
<div class="relative py-4">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-stone-100"></div>
</div>
<div class="relative flex justify-center text-xs uppercase">
<span class="bg-white px-4 text-muted font-bold font-label tracking-widest">or</span>
</div>
</div>
<div class="text-center">
<a class="inline-flex items-center gap-2 text-sm font-bold font-label text-dark hover:text-primary-dark transition-colors group" href="#">
                            Login as Tenant
                            <span class="material-symbols-outlined text-lg group-hover:translate-x-1 transition-transform">arrow_forward</span>
</a>
</div>
</form>
<!-- Footer Support -->
<div class="mt-12 flex flex-col sm:flex-row items-center justify-between gap-4 pt-8 border-t border-stone-100">
<p class="text-xs text-muted font-medium font-body">Need assistance?</p>
<div class="flex gap-4">
<button class="flex items-center gap-2 px-4 py-2 rounded-full border border-stone-200 hover:border-[#25D366] transition-colors group">
<img alt="WhatsApp" class="w-4 h-4" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAwAf5E4eqticJtInpptag4NWojiulPaixS4piApJR8Q6pv_sr37WGwVD3_nSkCtf6Ly5Mvn0zWrXaI56cWnTJSI4nG2sZKuBMR3QsLuLx-kG-anTgaFo_bYz_XQDqrmpta6W18JjtbzRuyHXBYpTB3hsfYKO3myRy0XBiY0unR5kcfy7kBdMKrSQGKXf6Mlxobna7mZtg8DfHD0_sSaM1Vf3T4aZyGUsE-p44RBH_9HLI2vYodaH-2fykpTupVJhs1tbXX7n3ilgxI"/>
<span class="text-xs font-bold font-label">WhatsApp</span>
</button>
<button class="flex items-center gap-2 px-4 py-2 rounded-full border border-stone-200 hover:border-[#0088cc] transition-colors group">
<img alt="Telegram" class="w-4 h-4" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA7NcYxRPygojQ9CcVGsXECEM4Y-e9s8vslr9HD6KIEuuP5tN6_ViAaCeR-_RYdK4rYeeKax1Cln87catpGJxD_EG0J7pzeQn7OLGYNJscXx30X9E_cNeEzaP_KKclTNRaS79HZf_wewNQMcTrNY9Dc2PJZc6zE9mp0TognCj5lA2MVNrZs_vTHgRqXNc0-edM1lXgamZQbA2SNejs6XeTVb6beF2C0cTP0VIcz7O29wTpY27awcXiosRJN-jOWvzs5P7VuKMowivF8"/>
<span class="text-xs font-bold font-label">Telegram Bot</span>
</button>
</div>
</div>
</div>
</section>
</main>
<!-- Hidden Registration Layout Reference (Visualized as a modal or secondary state potential) -->
<!-- This structure shows the design for the registration fields mentioned in the task -->
<div class="hidden">
<div class="grid grid-cols-2 gap-4">
<input class="bg-cream p-3 rounded-lg" placeholder="Full Name" type="text"/>
<input class="bg-cream p-3 rounded-lg" placeholder="Company Name" type="text"/>
<input class="bg-cream p-3 rounded-lg" placeholder="Email" type="email"/>
<div class="flex gap-2">
<select class="bg-cream p-3 rounded-lg w-24">
<option>🇦🇪 +971</option>
</select>
<input class="bg-cream p-3 rounded-lg flex-1" placeholder="WhatsApp" type="text"/>
</div>
<select class="bg-cream p-3 rounded-lg">
<option>Country</option>
<option>UAE</option>
</select>
<select class="bg-cream p-3 rounded-lg">
<option>Currency</option>
<option>AED</option>
</select>
<input class="bg-cream p-3 rounded-lg" placeholder="Password" type="password"/>
<input class="bg-cream p-3 rounded-lg" placeholder="Confirm Password" type="password"/>
</div>
</div>
</body></html>
